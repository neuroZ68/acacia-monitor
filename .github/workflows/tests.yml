# Installs the pinned dependencies and runs the deterministic tests on both Mac
# architectures. The Intel job is the pre-migration check for the 2019 MacBook Pro:
# it proves the pinned wheels install and the tests pass on x86_64, and it reports
# which ONNX Runtime providers the Intel wheel offers. It says nothing about speed
# or accuracy on the real machine.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: Apple silicon, Python 3.13
          - os: macos-15-intel
            label: Intel, Python 3.13
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Every pin has an Intel wheel
        if: matrix.os == 'macos-15-intel'
        run: python tools/check_intel_wheels.py

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Machine and ONNX Runtime providers
        run: |
          uname -m
          sw_vers
          python -c "import onnxruntime as ort; print('onnxruntime', ort.__version__, ort.get_available_providers())"

      - name: Deterministic tests
        run: python -m pytest -m "not integration" -q
